services:
  kiosk-engine:
    # Default: pull the published image. To build from source instead, add
    # `--build` (and build: . to build from the local tree).
    image: ${IMAGE:-ghcr.io/kunaalm/ha-photo-kiosk-py:latest}
    container_name: kiosk-engine
    # Reachable from the LAN so you can configure/upload from a laptop
    # (see README — the kiosk itself is meant to be hands-off).
    ports:
      - "8080:8080"
    environment:
      HA_URL: "${HA_URL:-http://localhost:8123}"
      PHOTO_SOURCE: "${PHOTO_SOURCE:-local}"
      PHOTO_DIR: "${PHOTO_DIR:-/photos}"
      IDLE_TIMEOUT_SECONDS: "${IDLE_TIMEOUT_SECONDS:-120}"
      SLIDE_INTERVAL_SECONDS: "${SLIDE_INTERVAL_SECONDS:-10}"
    volumes:
      - "${PHOTO_HOST_DIR:-./photos}:/photos"
      - kiosk-cache:/cache
    restart: unless-stopped

volumes:
  kiosk-cache: