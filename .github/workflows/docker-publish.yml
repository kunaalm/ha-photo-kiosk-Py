name: Publish Docker image

# Builds + publishes the engine container to GHCR.
# The GITHUB_TOKEN used by Actions automatically has write:packages for
# packages in this repo, so publishing from CI avoids needing a local PAT with
# write:packages scope. Shipped on every main push (latest) and on vX.Y.Z tags
# (versioned + latest).
#
# NOTE: the image name must be LOWERCASE — GHCR rejects uppercase tags, and
# this repo's name contains a capital P (ha-photo-kiosk-Py). So the image is
# ghcr.io/kunaalm/ha-photo-kiosk-py (lowercase 'py').

on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  # Lowercased image name (GHCR requires lowercase repository names).
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push (latest and/or versioned)
        run: |
          set -euo pipefail
          IMG="${REGISTRY}/$(echo "${IMAGE_NAME}" | tr 'A-Z' 'a-z')"
          echo "pushing to ${IMG}"
          # Always tag latest; also tag the version on v* tag pushes.
          TAGS="-t ${IMG}:latest"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VER="${GITHUB_REF#refs/tags/}"
            TAGS="${TAGS} -t ${IMG}:${VER}"
          fi
          docker build -t "${IMG}:build" .
          docker tag "${IMG}:build" "${IMG}:latest"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            docker tag "${IMG}:build" "${IMG}:${VER}"
          fi
          docker push "${IMG}:latest"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            docker push "${IMG}:${VER}"
          fi